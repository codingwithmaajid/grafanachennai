<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 240" width="100%" height="100%" fill="none" shape-rendering="geometricPrecision">
  <!-- ══════════════════════════════════════════════════════════════════════
       GROT MASCOT - 1:1 REPLICA OF USER'S UPLOADED PIC (images.png)
       ══════════════════════════════════════════════════════════════════════ -->

  <g id="grot-mascot" stroke-linecap="round" stroke-linejoin="round">

    <!-- ─── 1. TOP HEAD DORSAL FIN (ORANGE) ─── -->
    <path
      d="M 112 64 
         C 114 42, 122 22, 138 18 
         C 152 14, 165 32, 168 58 
         C 169 68, 166 76, 163 82 Z"
      fill="#F2652A"
      stroke="#171717"
      stroke-width="4.5"
    />

    <!-- ─── 2. BACK DORSAL SPINES (ORANGE RIDGES) ─── -->
    <!-- Top spike -->
    <path
      d="M 76 96 C 68 100, 62 106, 68 114 C 72 116, 78 116, 82 114 Z"
      fill="#F2652A"
      stroke="#171717"
      stroke-width="4"
    />
    <!-- Middle spike -->
    <path
      d="M 74 118 C 66 122, 63 128, 68 136 C 72 138, 78 138, 82 134 Z"
      fill="#F2652A"
      stroke="#171717"
      stroke-width="4"
    />
    <!-- Bottom spike -->
    <path
      d="M 74 140 C 66 144, 64 150, 70 156 C 74 158, 80 156, 84 152 Z"
      fill="#F2652A"
      stroke="#171717"
      stroke-width="4"
    />

    <!-- ─── 3. MAIN YELLOW BODY WITH SCALLOPED BOTTOM & CURLY TAIL ─── -->
    <path
      d="M 118 68
         C 146 58, 182 66, 198 94
         C 214 120, 216 152, 206 178
         C 202 188, 196 198, 186 208
         C 180 216, 172 234, 162 236
         C 152 238, 144 226, 136 226
         C 128 226, 122 236, 114 236
         C 106 236, 98 222, 92 216
         C 86 210, 80 214, 76 218
         C 70 224, 62 226, 56 220
         C 50 212, 54 200, 62 194
         C 70 188, 80 192, 82 200
         C 84 206, 80 210, 74 210
         C 70 210, 68 206, 70 202
         C 72 198, 76 198, 78 200
         C 80 196, 76 190, 68 190
         C 58 190, 48 204, 52 216
         C 56 228, 68 232, 78 226
         C 86 220, 92 210, 94 196
         C 96 182, 94 162, 94 148
         C 94 124, 98 98, 108 82
         C 112 76, 115 70, 118 68 Z"
      fill="#FFCD1C"
      stroke="#171717"
      stroke-width="4.5"
    />

    <!-- Tight spiral tail line details -->
    <path
      d="M 88 204
         C 80 214, 72 224, 62 222
         C 54 220, 52 208, 58 198
         C 64 188, 76 190, 80 198
         C 82 204, 78 208, 72 206"
      fill="none"
      stroke="#171717"
      stroke-width="4"
      stroke-linecap="round"
    />

    <!-- ─── 4. RIGHT FIN / FLIPPER (ORANGE) ─── -->
    <path
      d="M 198 174
         C 206 178, 214 186, 210 196
         C 206 204, 196 202, 192 192 Z"
      fill="#F2652A"
      stroke="#171717"
      stroke-width="4"
    />

    <!-- ─── 5. FLAGPOLE (SILVER/GREY) ─── -->
    <!-- Pole Shaft: runs from Grot's hand up to top-left -->
    <line
      x1="122"
      y1="188"
      x2="68"
      y2="14"
      stroke="#171717"
      stroke-width="14"
      stroke-linecap="round"
    />
    <line
      x1="122"
      y1="188"
      x2="68"
      y2="14"
      stroke="#9AA0A6"
      stroke-width="7"
      stroke-linecap="round"
    />

    <!-- Top Cap of Pole -->
    <polygon
      points="64,12 74,6 72,18 62,22"
      fill="#4B5563"
      stroke="#171717"
      stroke-width="3.5"
    />

    <!-- ─── 6. THE GRAFANA PENNANT FLAG (HORIZONTAL BOTTOM EDGE) ─── -->
    <!-- The flag is a triangle pointing left with a horizontal bottom edge -->
    <polygon
      points="5,88 66,16 98,88"
      fill="#FFFFFF"
      stroke="#171717"
      stroke-width="4.5"
      stroke-linejoin="round"
    />

    <!-- Flag attachment brackets / tabs on the pole -->
    <rect x="68" y="24" width="8" height="6" rx="1" fill="#FFFFFF" stroke="#171717" stroke-width="3" transform="rotate(23 68 24)" />
    <rect x="88" y="70" width="8" height="6" rx="1" fill="#FFFFFF" stroke="#171717" stroke-width="3" transform="rotate(23 88 70)" />

    <!-- Orange Grafana Spiral Logo on Flag -->
    <g transform="translate(56, 62) scale(0.85)">
      <!-- Orange Gear Teeth -->
      <path
        d="M -4 -16 L 4 -16 L 5 -12 L 11 -13 L 14 -16 L 19 -11 L 16 -8 L 18 -2 L 22 0 L 22 6 L 17 7 L 15 13 L 19 18 L 14 22 L 9 18 L 4 20 L 2 24 L -4 24 L -5 20 L -11 18 L -16 22 L -20 17 L -17 12 L -19 6 L -23 4 L -23 -2 L -18 -4 L -16 -10 L -20 -15 L -15 -19 L -10 -16 L -5 -18 Z"
        fill="#F2652A"
      />
      <!-- White Cutout Center Ring -->
      <circle cx="0" cy="2" r="10" fill="#FFFFFF" />
      <!-- Inner Orange Spiral Core with Loop -->
      <path
        d="M 1 2 
           A 5.5 5.5 0 1 1 -2.5 -2.5 
           L -0.8 -6 
           A 9 9 0 1 0 4.5 9.5 
           L 3.5 4.5 
           A 4.5 4.5 0 0 1 1 2 Z"
        fill="#F2652A"
      />
    </g>

    <!-- ─── 7. LEFT HAND CLAMPING FLAGPOLE (ORANGE) ─── -->
    <ellipse
      cx="112"
      cy="170"
      rx="13"
      ry="10"
      fill="#F2652A"
      stroke="#171717"
      stroke-width="4.5"
      transform="rotate(-22 112 170)"
    />

    <!-- ─── 8. CYBERPUNK TELEMETRY VISOR (PURPLE BEZEL + DARK SCREEN) ─── -->
    <!-- Black Outer Pill Contour -->
    <rect
      x="122"
      y="98"
      width="96"
      height="44"
      rx="22"
      fill="#171717"
    />

    <!-- Violet/Purple Visor Bezel -->
    <rect
      x="125"
      y="101"
      width="90"
      height="38"
      rx="19"
      fill="#4C5094"
    />

    <!-- Dark Navy / Black Visor Screen -->
    <rect
      x="129"
      y="105"
      width="82"
      height="30"
      rx="15"
      fill="#1A1B3B"
    />

    <!-- ─── 9. WHITE TELEMETRY EQUALIZER BARS ─── -->
    <g fill="#FFFFFF">
      <!-- Left Equalizer Columns -->
      <rect x="146" y="115" width="12" height="2.8" rx="0.8" />
      <rect x="149" y="120" width="9" height="2.8" rx="0.8" />
      <rect x="147" y="125" width="11" height="2.8" rx="0.8" />

      <!-- Center Equalizer Columns -->
      <rect x="163" y="117" width="9" height="2.8" rx="0.8" />
      <rect x="162" y="123" width="11" height="2.8" rx="0.8" />

      <!-- Right High-Frequency Equalizer Columns -->
      <rect x="178" y="112" width="14" height="2.6" rx="0.8" />
      <rect x="176" y="116.5" width="16" height="2.6" rx="0.8" />
      <rect x="177" y="121" width="15" height="2.6" rx="0.8" />
      <rect x="176" y="125.5" width="16" height="2.6" rx="0.8" />
      <rect x="177" y="130" width="14" height="2.6" rx="0.8" />

      <!-- Far Right Short Column -->
      <rect x="195" y="117" width="8" height="2.8" rx="0.8" />
      <rect x="194" y="123" width="9" height="2.8" rx="0.8" />
    </g>

    <!-- ─── 10. SMUG / PLAYFUL SMILE ─── -->
    <path
      d="M 164 148 L 176 150 L 182 147"
      fill="none"
      stroke="#171717"
      stroke-width="4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

  </g>
</svg>
